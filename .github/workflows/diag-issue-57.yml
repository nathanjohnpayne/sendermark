name: diag-issue-57
# Throwaway diagnostic for #57, round 2: measure a candidate fix (shellcheck
# --extended-analysis=false) on the same hosted runner. Never merged; lives
# only on the diag/issue-57-runner-memory branch.
on:
  push:
    branches: ["diag/issue-57-runner-memory"]
permissions:
  contents: read
jobs:
  measure:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: runner facts
        run: nproc; free -m; shellcheck --version | sed -n 2p
      - name: big test file without extended analysis
        continue-on-error: true
        run: |
          /usr/bin/time -f "test_phase_4b_automation.sh --extended-analysis=false: %e s, max RSS %M KB, exit %x" \
            shellcheck --severity=warning --extended-analysis=false tests/test_phase_4b_automation.sh
      - name: same 11-file invocation as check_phase_4b_automation, without extended analysis
        continue-on-error: true
        run: |
          /usr/bin/time -f "11 files --extended-analysis=false: %e s, max RSS %M KB, exit %x" \
            shellcheck --severity=warning --extended-analysis=false \
            scripts/phase-4b-review.sh scripts/phase-4b/lib.sh scripts/lib/codex-failure-markers.sh \
            scripts/phase-4b/adapters/review-via-codex.sh scripts/phase-4b/adapters/review-via-claude.sh \
            scripts/phase-4b/collect-enablement-evidence.sh tests/test_phase_4b_automation.sh \
            scripts/phase-4b/heartbeat.sh scripts/phase-4b/immutable-input.sh \
            tests/test_phase_4b_immutable_input.sh tests/test_phase_4b_heartbeat.sh
      - name: 10 files with extended analysis (everything except the big test file)
        continue-on-error: true
        run: |
          /usr/bin/time -f "10 files, extended analysis on: %e s, max RSS %M KB, exit %x" \
            shellcheck --severity=warning \
            scripts/phase-4b-review.sh scripts/phase-4b/lib.sh scripts/lib/codex-failure-markers.sh \
            scripts/phase-4b/adapters/review-via-codex.sh scripts/phase-4b/adapters/review-via-claude.sh \
            scripts/phase-4b/collect-enablement-evidence.sh \
            scripts/phase-4b/heartbeat.sh scripts/phase-4b/immutable-input.sh \
            tests/test_phase_4b_immutable_input.sh tests/test_phase_4b_heartbeat.sh
