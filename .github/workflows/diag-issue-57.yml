name: diag-issue-57
# Throwaway diagnostic for #57: measure the hosted runner and the memory that
# shellcheck uses in check_phase_4b_automation. Never merged; lives only on
# the diag/issue-57-runner-memory branch.
on:
  push:
    branches: ["diag/issue-57-runner-memory"]
permissions:
  contents: read
jobs:
  measure:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: runner facts
        run: |
          nproc; free -m; swapon --show || true; df -h / | tail -1
          shellcheck --version; command -v shellcheck
          cat /sys/fs/cgroup/memory.max 2>/dev/null || true
          ps -eo pid,rss,comm --sort=-rss | head -8
      - name: per-file shellcheck peak RSS (small files)
        continue-on-error: true
        run: |
          for f in scripts/phase-4b-review.sh scripts/phase-4b/lib.sh scripts/lib/codex-failure-markers.sh \
                   scripts/phase-4b/adapters/review-via-codex.sh scripts/phase-4b/adapters/review-via-claude.sh \
                   scripts/phase-4b/collect-enablement-evidence.sh scripts/phase-4b/heartbeat.sh \
                   scripts/phase-4b/immutable-input.sh tests/test_phase_4b_immutable_input.sh tests/test_phase_4b_heartbeat.sh; do
            /usr/bin/time -f "$f: %e s, max RSS %M KB, exit %x" shellcheck --severity=warning "$f" >/dev/null || true
          done
      - name: big test file, capped at 6 GiB in its own cgroup
        continue-on-error: true
        run: |
          sudo systemd-run --quiet --scope -p MemoryMax=6G -p MemorySwapMax=0 \
            /usr/bin/time -f "test_phase_4b_automation.sh: %e s, max RSS %M KB, exit %x" \
            shellcheck --severity=warning tests/test_phase_4b_automation.sh >/dev/null; echo "rc=$?"
          sudo dmesg | grep -iE 'oom|killed process' | tail -5 || true
      - name: full check_phase_4b_automation --check with a memory sampler
        continue-on-error: true
        run: |
          ( while :; do echo "SAMPLE $(date +%T) $(free -m | awk '/Mem:/{print "used="$3"MB avail="$7"MB"}') $(ps -eo rss,comm --sort=-rss | sed -n 2p)"; sleep 2; done ) &
          sampler=$!
          /usr/bin/time -f "check --check: %e s, max RSS of child %M KB, exit %x" ./scripts/ci/check_phase_4b_automation --check; echo "rc=$?"
          kill $sampler || true
      - name: oom evidence
        if: always()
        run: sudo dmesg | grep -iE 'oom|killed process|out of memory' | tail -20 || echo "no oom lines"
